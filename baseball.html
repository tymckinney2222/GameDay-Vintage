<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>THE DUGOUT — Player Research</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Barlow+Condensed:wght@400;600;700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08080e;
  --bg2:#0c0c16;
  --bg3:#111120;
  --card:rgba(255,255,255,0.03);
  --card2:rgba(255,255,255,0.055);
  --border:rgba(255,255,255,0.07);
  --border2:rgba(255,255,255,0.12);
  --text:#fff;
  --text2:rgba(255,255,255,0.65);
  --text3:rgba(255,255,255,0.38);
  --text4:rgba(255,255,255,0.18);
  --red:#e63946;
  --green:#2dc653;
  --amber:#f4a261;
  --blue:#4895ef;
  --cyan:#48cae4;
  --purple:#9b72cf;
  --accent:#e63946;
}
html{overscroll-behavior-y:contain}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Outfit',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

/* ── HEADER ── */
.app-header{
  position:sticky;top:0;z-index:100;
  background:rgba(8,8,14,0.95);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  padding:14px 16px 12px;
}
.app-title{
  font-family:'Barlow Condensed',sans-serif;
  font-size:22px;font-weight:900;letter-spacing:3px;
  text-transform:uppercase;
  background:linear-gradient(90deg,#fff 0%,rgba(255,255,255,0.5) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.app-sub{font-size:10px;color:var(--text3);letter-spacing:2px;margin-top:1px;font-family:'Barlow Condensed',sans-serif;font-weight:600}

/* ── SEARCH ── */
.search-wrap{padding:14px 16px 10px;position:relative}
.search-input{
  width:100%;background:var(--card2);
  border:1px solid var(--border2);
  border-radius:12px;padding:12px 48px 12px 16px;
  color:var(--text);font-family:'Outfit',sans-serif;font-size:14px;
  outline:none;transition:border-color 0.2s;
}
.search-input:focus{border-color:rgba(255,255,255,0.25)}
.search-input::placeholder{color:var(--text3)}
.search-btn{
  position:absolute;right:24px;top:50%;transform:translateY(-50%);
  background:none;border:none;color:var(--text3);font-size:18px;cursor:pointer;
  padding:4px;
}
.search-results{
  position:absolute;top:100%;left:16px;right:16px;z-index:50;
  background:#13131f;border:1px solid var(--border2);border-radius:10px;
  overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,0.6);
  display:none;
}
.search-results.open{display:block}
.search-result-item{
  padding:11px 14px;border-bottom:1px solid var(--border);
  cursor:pointer;display:flex;align-items:center;gap:10px;
  transition:background 0.1s;
}
.search-result-item:last-child{border-bottom:none}
.search-result-item:active{background:var(--card2)}
.sr-photo{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--card2)}
.sr-name{font-size:13px;font-weight:700;color:var(--text)}
.sr-meta{font-size:10px;color:var(--text3);margin-top:1px}
.sr-pos{
  margin-left:auto;font-family:'Barlow Condensed',sans-serif;
  font-size:11px;font-weight:700;letter-spacing:1px;
  color:var(--text3);background:var(--card2);
  padding:2px 7px;border-radius:4px;
}

/* ── EMPTY STATE ── */
.empty-state{
  padding:60px 24px;text-align:center;
}
.empty-icon{font-size:48px;margin-bottom:16px;opacity:0.5}
.empty-title{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:18px;letter-spacing:2px;color:var(--text2);text-transform:uppercase}
.empty-sub{font-size:12px;color:var(--text3);margin-top:8px;line-height:1.6}

/* ── PLAYER CARD ── */
#playerView{display:none;animation:fadeUp 0.3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.player-hero{
  position:relative;overflow:hidden;
  padding:20px 16px 16px;
  background:linear-gradient(180deg,var(--bg3) 0%,var(--bg) 100%);
  border-bottom:1px solid var(--border);
}
.player-hero-bg{
  position:absolute;inset:0;opacity:0.06;
  background-size:cover;background-position:center top;
  filter:blur(20px);
}
.player-hero-content{position:relative;z-index:1;display:flex;gap:14px;align-items:flex-start}
.player-photo-wrap{position:relative;flex-shrink:0}
.player-photo{
  width:80px;height:80px;border-radius:12px;
  object-fit:cover;background:var(--card2);
  border:2px solid var(--border2);
}
.player-pos-badge{
  position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);
  font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:10px;
  letter-spacing:1.5px;padding:2px 8px;border-radius:4px;
  background:var(--accent);color:#fff;white-space:nowrap;
}
.player-info{flex:1;min-width:0;padding-top:2px}
.player-name{
  font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:26px;
  line-height:1;color:#fff;letter-spacing:0.5px;
}
.player-team-line{
  display:flex;align-items:center;gap:8px;margin-top:6px;
}
.player-team-logo{width:22px;height:22px;object-fit:contain}
.player-team-name{font-size:12px;color:var(--text2);font-weight:600}
.player-bats-throws{font-size:10px;color:var(--text3);margin-top:4px;font-family:'Share Tech Mono',monospace}
.player-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.player-tag{
  font-size:10px;font-weight:700;letter-spacing:0.5px;
  padding:3px 8px;border-radius:5px;font-family:'Barlow Condensed',sans-serif;
}
.tag-age{background:rgba(72,149,239,0.15);color:#4895ef}
.tag-status-active{background:rgba(45,198,83,0.15);color:#2dc653}
.tag-status-il{background:rgba(230,57,70,0.15);color:#e63946}
.tag-hand{background:rgba(255,255,255,0.07);color:var(--text2)}
.tag-number{background:rgba(255,255,255,0.07);color:var(--text2)}

/* Quick season line */
.quick-stats{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:1px;background:var(--border);
  border-top:1px solid var(--border);border-bottom:1px solid var(--border);
  margin:0;
}
.qs-cell{
  background:var(--bg);padding:10px 4px;text-align:center;
}
.qs-val{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:20px;color:#fff}
.qs-lbl{font-size:9px;color:var(--text3);letter-spacing:1px;margin-top:1px;font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase}

/* ── TABS ── */
.tab-bar{
  display:flex;overflow-x:auto;
  border-bottom:1px solid var(--border);
  background:var(--bg);position:sticky;top:66px;z-index:90;
  scrollbar-width:none;
}
.tab-bar::-webkit-scrollbar{display:none}
.tab-btn{
  flex-shrink:0;padding:12px 16px;
  font-family:'Barlow Condensed',sans-serif;font-weight:700;
  font-size:12px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--text3);background:none;border:none;cursor:pointer;
  border-bottom:2px solid transparent;transition:all 0.15s;
  white-space:nowrap;
}
.tab-btn.active{color:#fff;border-bottom-color:var(--accent)}
.tab-btn.tab-home{color:var(--amber);padding-right:10px}
.tab-btn:hover:not(.active){color:var(--text2)}

/* ── TAB PANELS ── */
.tab-panel{display:none;padding:16px 16px 100px}
.tab-panel.active{display:block;animation:fadeUp 0.2s ease}

/* Section headers */
.section-hdr{
  font-family:'Barlow Condensed',sans-serif;font-weight:800;
  font-size:11px;letter-spacing:2.5px;text-transform:uppercase;
  color:var(--text3);margin:20px 0 10px;padding-bottom:6px;
  border-bottom:1px solid var(--border);
}
.section-hdr:first-child{margin-top:0}

/* Stat grid cards */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.stat-grid-4{grid-template-columns:repeat(4,1fr)}
.stat-grid-2{grid-template-columns:repeat(2,1fr)}
.stat-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:10px 8px;text-align:center;
}
.sc-val{
  font-family:'Barlow Condensed',sans-serif;font-weight:900;
  font-size:22px;color:#fff;line-height:1;
}
.sc-val.elite{color:var(--green)}
.sc-val.good{color:#90e0a0}
.sc-val.avg{color:var(--text2)}
.sc-val.poor{color:var(--amber)}
.sc-val.bad{color:var(--red)}
.sc-lbl{
  font-size:9px;color:var(--text3);margin-top:4px;
  font-family:'Barlow Condensed',sans-serif;font-weight:700;
  letter-spacing:1px;text-transform:uppercase;
}
.sc-sub{font-size:9px;color:var(--text4);margin-top:1px;font-family:'Share Tech Mono',monospace}

/* Year-by-year table */
.stats-table-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--border)}
.stats-table{width:100%;border-collapse:collapse;font-size:11px;min-width:500px}
.stats-table thead th{
  background:var(--bg3);padding:8px 6px;
  font-family:'Barlow Condensed',sans-serif;font-weight:700;
  font-size:10px;letter-spacing:1px;color:var(--text3);
  text-align:center;border-bottom:1px solid var(--border);white-space:nowrap;
}
.stats-table thead th:first-child,.stats-table tbody td:first-child{text-align:left;padding-left:10px}
.stats-table tbody td{
  padding:8px 6px;text-align:center;color:var(--text2);
  border-bottom:1px solid rgba(255,255,255,0.03);
  font-family:'Share Tech Mono',monospace;font-size:11px;
}
.stats-table tbody tr:last-child td{border-bottom:none}
.stats-table tbody tr:hover td{background:var(--card2)}
.stats-table .yr-col{color:var(--text3);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px}
.stats-table .team-col{color:var(--text2);font-family:'Barlow Condensed',sans-serif;font-weight:700}
.stats-table .highlight{color:#fff;font-weight:700}
.stats-table .total-row td{background:rgba(255,255,255,0.04);color:#fff;font-weight:700;border-top:1px solid var(--border2)}

/* Percentile bars */
.pct-row{margin-bottom:10px}
.pct-label-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.pct-name{font-size:11px;color:var(--text2);font-weight:600}
.pct-val{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:13px}
.pct-track{height:6px;background:rgba(255,255,255,0.07);border-radius:3px;overflow:hidden}
.pct-fill{height:100%;border-radius:3px;transition:width 0.8s cubic-bezier(0.34,1.56,0.64,1)}
.pct-elite{background:linear-gradient(90deg,#2dc653,#4ade80)}
.pct-good{background:linear-gradient(90deg,#16a34a,#2dc653)}
.pct-avg{background:linear-gradient(90deg,#3b82f6,#60a5fa)}
.pct-poor{background:linear-gradient(90deg,#d97706,#f4a261)}
.pct-bad{background:linear-gradient(90deg,#dc2626,#e63946)}

/* Pitch arsenal */
.arsenal-grid{display:flex;flex-direction:column;gap:8px}
.arsenal-pitch{
  background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:12px 14px;
}
.ap-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.ap-name{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:14px;letter-spacing:0.5px}
.ap-usage{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--text3)}
.ap-usage-bar{height:4px;background:rgba(255,255,255,0.07);border-radius:2px;overflow:hidden;margin-bottom:10px}
.ap-usage-fill{height:100%;border-radius:2px}
.ap-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ap-stat{text-align:center}
.ap-stat-val{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:15px;color:#fff}
.ap-stat-lbl{font-size:8px;color:var(--text3);letter-spacing:1px;font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;margin-top:1px}

/* Game log */
.gamelog-table-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--border)}
.gamelog-table{width:100%;border-collapse:collapse;min-width:420px}
.gamelog-table thead th{
  background:var(--bg3);padding:7px 5px;
  font-family:'Barlow Condensed',sans-serif;font-weight:700;
  font-size:9px;letter-spacing:1.5px;color:var(--text3);
  text-align:center;border-bottom:1px solid var(--border);
}
.gamelog-table thead th:first-child,.gamelog-table tbody td:first-child{text-align:left;padding-left:10px}
.gamelog-table tbody td{
  padding:7px 5px;text-align:center;
  border-bottom:1px solid rgba(255,255,255,0.03);
  font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--text2);
}
.gamelog-table tbody tr:last-child td{border-bottom:none}
.gamelog-table tbody tr:hover td{background:var(--card2)}
.gl-date{color:var(--text3);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px}
.gl-opp{color:var(--text2);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px}
.gl-good{color:var(--green)}
.gl-bad{color:var(--red)}
.gl-avg{color:var(--text2)}
.gl-result-w{color:var(--green);font-weight:700;font-family:'Barlow Condensed',sans-serif}
.gl-result-l{color:var(--red);font-weight:700;font-family:'Barlow Condensed',sans-serif}

/* Splits */
.splits-section{margin-bottom:20px}
.splits-table-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--border)}
.splits-table{width:100%;border-collapse:collapse;min-width:360px}
.splits-table thead th{
  background:var(--bg3);padding:7px 6px;
  font-family:'Barlow Condensed',sans-serif;font-weight:700;
  font-size:9px;letter-spacing:1.5px;color:var(--text3);
  text-align:center;border-bottom:1px solid var(--border);
}
.splits-table thead th:first-child,.splits-table tbody td:first-child{text-align:left;padding-left:10px;min-width:80px}
.splits-table tbody td{
  padding:8px 6px;text-align:center;
  border-bottom:1px solid rgba(255,255,255,0.03);
  font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--text2);
}
.splits-table tbody tr:last-child td{border-bottom:none}
.splits-table .split-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;color:#fff}

/* Bio */
.bio-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bio-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.bio-label{font-size:9px;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;font-family:'Barlow Condensed',sans-serif;font-weight:700}
.bio-value{font-size:14px;font-weight:700;color:#fff;margin-top:3px;font-family:'Barlow Condensed',sans-serif}

/* Statcast ring indicators */
.sc-ring-wrap{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}

/* Loading */
.tab-loading{
  padding:40px 16px;text-align:center;
  font-family:'Barlow Condensed',sans-serif;font-size:12px;
  letter-spacing:2px;color:var(--text3);text-transform:uppercase;
}
.loading-dot{display:inline-block;animation:ldot 1.2s infinite}
.loading-dot:nth-child(2){animation-delay:0.2s}
.loading-dot:nth-child(3){animation-delay:0.4s}
@keyframes ldot{0%,80%,100%{opacity:0.2}40%{opacity:1}}

/* Injury banner */
.injury-banner{
  background:rgba(230,57,70,0.1);border:1px solid rgba(230,57,70,0.3);
  border-radius:8px;padding:8px 12px;margin-bottom:12px;
  display:flex;align-items:center;gap:8px;
  font-size:11px;color:#fca5a5;
}

/* Comparison bar (better/worse) */
.comp-bar{
  height:4px;border-radius:2px;background:rgba(255,255,255,0.07);
  overflow:hidden;margin-top:4px;
}
.comp-fill-pos{background:var(--green);height:100%;border-radius:2px}
.comp-fill-neg{background:var(--red);height:100%;border-radius:2px}

/* War card */
.war-display{
  background:linear-gradient(135deg,rgba(155,114,207,0.12),rgba(72,149,239,0.08));
  border:1px solid rgba(155,114,207,0.25);
  border-radius:12px;padding:14px 16px;
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:8px;
}
.war-val{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:40px;color:#fff}
.war-label{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:11px;letter-spacing:2px;color:var(--purple);text-transform:uppercase}
.war-desc{font-size:10px;color:var(--text3);margin-top:3px;max-width:160px}
.war-rank{text-align:right}
.war-rank-val{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:22px;color:var(--purple)}
.war-rank-lbl{font-size:9px;color:var(--text3);letter-spacing:1px;font-family:'Barlow Condensed',sans-serif}

/* Streak indicator */
.streak-wrap{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.streak-day{
  width:28px;height:28px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;font-family:'Barlow Condensed',sans-serif;
}
.streak-hot{background:rgba(45,198,83,0.2);color:#2dc653;border:1px solid rgba(45,198,83,0.3)}
.streak-cold{background:rgba(230,57,70,0.15);color:#e63946;border:1px solid rgba(230,57,70,0.25)}
.streak-avg{background:var(--card);color:var(--text3);border:1px solid var(--border)}
.streak-dnp{background:transparent;color:var(--text4);border:1px solid rgba(255,255,255,0.05)}

/* Scroll hint on tables */
.scroll-hint{
  font-size:9px;color:var(--text4);text-align:right;
  margin-bottom:4px;font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;
}

/* No data */
.no-data{
  padding:24px;text-align:center;color:var(--text3);
  font-size:11px;font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;
  text-transform:uppercase;
}

/* Pitcher/Batter toggle on overview */
.type-badge{
  display:inline-flex;align-items:center;gap:4px;
  font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:10px;
  letter-spacing:1.5px;padding:4px 10px;border-radius:6px;margin-bottom:12px;
}
.type-badge.batter{background:rgba(72,202,228,0.12);color:var(--cyan);border:1px solid rgba(72,202,228,0.2)}
.type-badge.pitcher{background:rgba(230,57,70,0.12);color:var(--red);border:1px solid rgba(230,57,70,0.2)}

/* ── HOME BOARDS ── */
#homeBoards{padding:2px 16px 120px}
.hb-head{display:flex;justify-content:space-between;align-items:center;margin:18px 0 8px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:12px;letter-spacing:2px;color:var(--text3)}
.hb-head button{background:var(--card2);border:1px solid var(--border);color:var(--text2);font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:10px;letter-spacing:1.5px;padding:5px 9px;border-radius:6px;cursor:pointer}
.hb-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:4px 12px}
.hb-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:13px;color:var(--text2);cursor:pointer}
.hb-row:last-child{border-bottom:none}
.hb-row b{font-family:'Barlow Condensed',sans-serif;font-size:15px;color:#fff;white-space:nowrap}
.hb-row b.gl-good{color:var(--green)}
.hb-yr{text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:2px;color:var(--text4);margin-top:12px}
.hb-wait{padding:36px 0;text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:2px;color:var(--text3);text-transform:uppercase}
.hb-btns{margin-top:16px}
.hb-btns button{width:100%;background:var(--card2);border:1px solid var(--border2);color:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:13px;letter-spacing:2px;padding:13px 0;border-radius:12px;cursor:pointer}
/* ── TOOLS ── */
#toolView{display:none}
.tv-bar{position:sticky;top:66px;z-index:90;background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:10px 16px}
body.embed .tv-bar{top:0}
.tv-bar button{background:none;border:none;color:var(--amber);font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:13px;letter-spacing:1.5px;cursor:pointer;padding:4px 0}
.tv-bar b{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:18px;letter-spacing:1px;text-transform:uppercase}

/* ── CARD 3 ── */

<body>

<div class="app-header">
  <div class="app-title">The Dugout</div>
  <div class="app-sub">⚾ Player Research · Powered by Statcast + MLB API</div>
</div>

<div class="search-wrap" style="position:relative">
  <input class="search-input" id="searchInput" type="text" placeholder="Search player name..." autocomplete="off" autocorrect="off" spellcheck="false">
  <button class="search-btn" onclick="doSearch()">🔍</button>
  <div class="search-results" id="searchResults"></div>
</div>

<!-- Home: the boards, then the way into each tool -->
<div id="emptyState"><div id="homeBoards"></div></div>

<!-- A tool: Luck Board, Leaderboards, Nastiest Pitches, Compare -->
<div id="toolView"></div>

<!-- Player view -->
<div id="playerView">

  <!-- Hero -->
  <div class="player-hero" id="playerHero">
    <div class="player-hero-bg" id="heroBg"></div>
    <div class="player-hero-content">
      <div class="player-photo-wrap">
        <img class="player-photo" id="playerPhoto" src="" alt="">
        <div class="player-pos-badge" id="playerPosBadge">SP</div>
      </div>
      <div class="player-info">
        <div class="player-name" id="playerName">—</div>
        <div class="player-team-line">
          <img class="player-team-logo" id="playerTeamLogo" src="" alt="">
          <span class="player-team-name" id="playerTeamName">—</span>
        </div>
        <div class="player-tags" id="playerTags"></div>
      </div>
    </div>
  </div>

  <!-- Quick stats strip -->
  <div class="quick-stats" id="quickStats"></div>

  <!-- Tabs -->
  <div class="tab-bar" id="tabBar"></div>

  <!-- Tab panels -->
  <div id="tabPanels"></div>

</div>

<script>
// ═══════════════════════════════════════
// CONFIG — swap these for your Worker URL
// ═══════════════════════════════════════
var WORKER_URL = 'https://baseball-proxy.tymckinney2222.workers.dev';
var USE_MOCK = false; // flip to true to use mock data for UI testing

// ═══════════════════════════════════════
// STATE
// ═══════════════════════════════════════
var currentPlayer = null;
var activeTab = null;
var searchTimer = null;
var _searchHits = [];

// ═══════════════════════════════════════
// SEARCH
// ═══════════════════════════════════════
document.getElementById('searchInput').addEventListener('input', function() {
  clearTimeout(searchTimer);
  var q = this.value.trim();
  if (q.length < 2) { closeSearch(); return; }
  searchTimer = setTimeout(function() { doSearch(q); }, 300);
});

document.getElementById('searchInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') { doSearch(this.value.trim()); }
  if (e.key === 'Escape') { closeSearch(); }
});

document.addEventListener('click', function(e) {
  if (!e.target.closest('.search-wrap')) closeSearch();
});

function closeSearch() {
  document.getElementById('searchResults').classList.remove('open');
}

async function doSearch(q) {
  q = q || document.getElementById('searchInput').value.trim();
  if (!q || q.length < 2) return;

  var el = document.getElementById('searchResults');
  el.innerHTML = '<div style="padding:12px 14px;font-size:11px;color:rgba(255,255,255,0.3);font-family:Barlow Condensed,sans-serif;letter-spacing:1px">Searching...</div>';
  el.classList.add('open');

  try {
    var results = await searchPlayers(q);
    if (!results.length) {
      el.innerHTML = '<div style="padding:12px 14px;font-size:11px;color:rgba(255,255,255,0.3);font-family:Barlow Condensed,sans-serif;letter-spacing:1px">No players found</div>';
      return;
    }
    _searchHits = results.slice(0, 8);
    el.innerHTML = _searchHits.map(function(p, i) {
      return '<div class="search-result-item" onclick="selectPlayer(_searchHits[' + i + '])">' +
        '<img class="sr-photo" src="' + (p.photo || '') + '" onerror="this.style.background=\'rgba(255,255,255,0.05)\';this.src=\'\'">' +
        '<div><div class="sr-name">' + p.fullName + '</div>' +
        '<div class="sr-meta">' + (p.team || 'Free Agent') + ' · ' + (p.position || '') + '</div></div>' +
        '<div class="sr-pos">' + (p.position || '—') + '</div>' +
        '</div>';
    }).join('');
  } catch(e) {
    console.error('doSearch error:', e);
    el.innerHTML = '<div style="padding:12px 14px;font-size:11px;color:#e63946;font-family:Barlow Condensed,sans-serif">Search failed: ' + (e.message || 'unknown error') + '</div>';
  }
}

async function searchPlayers(q) {
  if (USE_MOCK) return mockSearch(q);
  try {
    var res = await fetch(WORKER_URL + '/search?q=' + encodeURIComponent(q));
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var data = await res.json();
    // Handle error object from worker
    if (!Array.isArray(data)) {
      console.error('Search returned non-array:', data);
      return [];
    }
    return data;
  } catch(e) {
    console.error('Search error:', e);
    throw e;
  }
}

// ═══════════════════════════════════════
// PLAYER SELECTION
// ═══════════════════════════════════════
async function selectPlayer(p) {
  closeSearch();
  document.getElementById('searchInput').value = p.fullName;
  _tool = null;
  document.getElementById('toolView').style.display = 'none';
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('playerView').style.display = 'block';
  currentPlayer = p;
  renderPlayerShell(p);
  loadPlayerData(p);
}

function renderPlayerShell(p) {
  document.getElementById('playerName').textContent = p.fullName;
  document.getElementById('playerPosBadge').textContent = p.position || '—';
  document.getElementById('playerTeamName').textContent = p.team || 'Free Agent';
  var photo = document.getElementById('playerPhoto');
  photo.src = p.photo || '';
  photo.onerror = function() { this.style.opacity = '0.3'; };
  var logo = document.getElementById('playerTeamLogo');
  logo.src = p.teamLogo || '';
  document.getElementById('heroBg').style.backgroundImage = 'url(' + (p.photo || '') + ')';

  var isPitcher = isPitcherPos(p.position);
  var tags = document.getElementById('playerTags');
  tags.innerHTML =
    (p.age ? '<span class="player-tag tag-age">Age ' + p.age + '</span>' : '') +
    (p.number ? '<span class="player-tag tag-number">#' + p.number + '</span>' : '') +
    (p.bats ? '<span class="player-tag tag-hand">B: ' + p.bats + '</span>' : '') +
    (p.throws ? '<span class="player-tag tag-hand">T: ' + p.throws + '</span>' : '') +
    (p.status === 'IL' ? '<span class="player-tag tag-status-il">🏥 IL</span>' : '<span class="player-tag tag-status-active">✓ Active</span>');

  // Tabs depend on pitcher vs batter
  renderTabs(isPitcher);

  // Loading states
  document.getElementById('quickStats').innerHTML = '';
  document.getElementById('tabPanels').innerHTML = '';
}

// Back to the screen this page opens on.
function goHome() {
  currentPlayer = null;
  _playerData = null;
  _tool = null;
  document.getElementById('toolView').style.display = 'none';
  document.getElementById('playerView').style.display = 'none';
  document.getElementById('emptyState').style.display = '';
  document.getElementById('searchInput').value = '';
  loadHome();
  closeSearch();
  window.scrollTo(0, 0);
}

function isPitcherPos(pos) {
  return pos && (pos === 'SP' || pos === 'RP' || pos === 'CP' || pos === 'P');
}

function renderTabs(isPitcher) {
  var tabs = isPitcher
    ? ['Overview','Stats','Statcast','Arsenal','Splits','Game Log','Bio']
    : ['Overview','Stats','Statcast','Splits','Game Log','Bio'];

  var bar = document.getElementById('tabBar');
  // HOME is first in the bar, and the bar stays on screen, so the way back is always in reach
  bar.innerHTML = '<button class="tab-btn tab-home" onclick="goHome()">\u2039 HOME</button>' + tabs.map(function(t, i) {
    return '<button class="tab-btn' + (i===0?' active':'') + '" onclick="switchTab(\'' + t + '\',this)">' + t + '</button>';
  }).join('');

  activeTab = tabs[0];
}

function switchTab(name, btn) {
  document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
  if (btn) btn.classList.add('active');
  activeTab = name;
  renderTabContent(name);
}

// ═══════════════════════════════════════
// DATA LOADING
// ═══════════════════════════════════════
async function loadPlayerData(p) {
  try {
    var data = USE_MOCK ? await mockPlayerData(p) : await fetchPlayerData(p);
    renderAllTabs(data, p);
  } catch(e) {
    console.error('Player data error:', e);
  }
}

async function fetchPlayerData(p) {
  // Fetch main player data and statcast data in parallel
  var [mainRes, scRes] = await Promise.allSettled([
    fetch(WORKER_URL + '/player/' + p.id).then(function(r) { return r.json(); }),
    fetch(WORKER_URL + '/statcast/' + p.id).then(function(r) { return r.ok ? r.json() : null; }).catch(function() { return null; })
  ]);

  var data = mainRes.status === 'fulfilled' ? mainRes.value : {};
  var scData = scRes.status === 'fulfilled' ? scRes.value : null;

  // Merge statcast if the worker returned it separately and the /player response was empty
  // Use the separate Statcast answer whenever the main one came back with nothing in it.
  var scHas = function(o) {
    if (!o || o.error) return false;
    if (o.percentiles && o.percentiles.length) return true;
    for (var k in o) { if (k !== 'percentiles' && k !== 'year' && o[k] != null && o[k] !== '') return true; }
    return false;
  };
  if (scHas(scData) && !scHas(data.statcast)) {
    data.statcast = scData;
  }

  return data;
}

var _playerData = null;
function renderAllTabs(data, p) {
  _playerData = data;
  if (data.position && p.position !== data.position && (data.isPitcher !== undefined)) {
    var was = isPitcherPos(p.position);
    p.position = data.isPitcher ? (isPitcherPos(data.position) ? data.position : 'P') : data.position;
    document.getElementById('playerPosBadge').textContent = p.position || '—';
    if (was !== isPitcherPos(p.position)) { renderTabs(isPitcherPos(p.position)); }
  }
  var isPitcher = isPitcherPos(p.position);

  // Update team name/logo from worker data
  if (data.teamName) document.getElementById('playerTeamName').textContent = data.teamName;
  if (data.teamId) document.getElementById('playerTeamLogo').src = 'https://www.mlbstatic.com/team-logos/' + data.teamId + '.svg';

  // currentSeason fallback — if empty, use most recent career entry
  var cs = data.currentSeason || {};
  var hasCS = isPitcher ? (cs.era || cs.ip) : (cs.avg || cs.ops);
  if (!hasCS && data.careerStats && data.careerStats.length) {
    var last = data.careerStats[data.careerStats.length - 1];
    // Only use if it's this season
    if (String(last.year) === String(data.warYear || new Date().getFullYear())) {
      data.currentSeason = last;
      cs = last;
      hasCS = true;
    }
  }

  // Quick stats strip
  var qs = document.getElementById('quickStats');
  if (isPitcher) {
    qs.innerHTML = makeQS([
      {val: cs.era || '—', lbl: 'ERA'},
      {val: cs.whip || '—', lbl: 'WHIP'},
      {val: cs.k9 || '—', lbl: 'K/9'},
      {val: (cs.w != null && cs.l != null) ? cs.w + '-' + cs.l : '—', lbl: 'W-L'},
    ]);
  } else {
    qs.innerHTML = makeQS([
      {val: cs.avg || '.---', lbl: 'AVG'},
      {val: cs.obp || '.---', lbl: 'OBP'},
      {val: cs.slg || '.---', lbl: 'SLG'},
      {val: cs.hr != null ? cs.hr : '—', lbl: 'HR'},
    ]);
  }

  renderTabContent(activeTab || 'Overview');
}

function makeQS(items) {
  return items.map(function(i) {
    return '<div class="qs-cell"><div class="qs-val">' + i.val + '</div><div class="qs-lbl">' + i.lbl + '</div></div>';
  }).join('');
}

function renderTabContent(tab) {
  if (!_playerData) return;
  var el = document.getElementById('tabPanels');
  var isPitcher = isPitcherPos(currentPlayer && currentPlayer.position);

  var html = '<div class="tab-panel active">';
  switch(tab) {
    case 'Overview': html += renderOverview(isPitcher); break;
    case 'Stats': html += renderStats(isPitcher); break;
    case 'Statcast': html += renderStatcast(isPitcher); break;
    case 'Arsenal': html += renderArsenal(); break;
    case 'Splits': html += renderSplits(isPitcher); break;
    case 'Game Log': html += renderGameLog(isPitcher); break;
    case 'Bio': html += renderBio(); break;
    default: html += '<div class="no-data">Coming soon</div>';
  }
  html += '</div>';
  el.innerHTML = html;
}

// ═══════════════════════════════════════
// TAB RENDERS
// ═══════════════════════════════════════
function renderOverview(isPitcher) {
  var d = _playerData;
  var cs = d.currentSeason || {};
  var sc = d.statcast || {};
  var html = '';

  html += '<div class="type-badge ' + (isPitcher ? 'pitcher' : 'batter') + '">' + (isPitcher ? '⚾ PITCHER' : '🏏 BATTER') + '</div>';

  // WAR card
  if (d.war != null) {
    html += '<div class="war-display">' +
      '<div><div class="war-label">fWAR ' + (d.warYear || new Date().getFullYear()) + '</div>' +
      '<div class="war-val">' + d.war + '</div>' +
      '<div class="war-desc">' + warDescription(d.war) + '</div></div>' +
      '<div class="war-rank"><div class="war-rank-val">#' + (d.warRank || '—') + '</div>' +
      '<div class="war-rank-lbl">MLB RANK</div></div>' +
      '</div>';
  }

  // Injury
  if (currentPlayer && currentPlayer.status === 'IL') {
    html += '<div class="injury-banner">🏥 <strong>' + (d.injuryNote || 'On Injured List') + '</strong></div>';
  }

  // Card 3: his tools graded, and whether his numbers are real
  html += renderGrades(sc, isPitcher) + renderLuck(sc, isPitcher);

  // Recent form (last 15 games)
  if (d.recentForm && d.recentForm.length) {
    html += '<div class="section-hdr">Recent Form — Last 15 Games</div>';
    html += '<div class="streak-wrap">';
    d.recentForm.forEach(function(g) {
      var cls = g.rating === 'hot' ? 'streak-hot' : g.rating === 'cold' ? 'streak-cold' : g.rating === 'dnp' ? 'streak-dnp' : 'streak-avg';
      html += '<div class="streak-day ' + cls + '" title="' + (g.date||'') + '">' + (g.label||'·') + '</div>';
    });
    html += '</div>';
  }

  // Key Statcast percentiles
  if (sc.percentiles && sc.percentiles.length) {
    html += '<div class="section-hdr">Statcast Percentiles</div>';
    sc.percentiles.slice(0,6).forEach(function(p) {
      html += renderPctBar(p.name, p.value, p.pct);
    });
  }

  // This season at a glance
  html += '<div class="section-hdr">' + (d.warYear || new Date().getFullYear()) + ' Season</div>';
  if (isPitcher) {
    html += '<div class="stat-grid">' +
      makeStatCard(cs.era,'ERA','','') +
      makeStatCard(cs.whip,'WHIP','','') +
      makeStatCard(cs.fip,'FIP','','') +
      makeStatCard(cs.k9,'K/9','','') +
      makeStatCard(cs.bb9,'BB/9','','') +
      makeStatCard(cs.ip,'IP','','') +
    '</div>';
  } else {
    html += '<div class="stat-grid">' +
      makeStatCard(cs.avg,'AVG','','') +
      makeStatCard(cs.obp,'OBP','','') +
      makeStatCard(cs.slg,'SLG','','') +
      makeStatCard(cs.ops,'OPS','','') +
      makeStatCard(cs.wrc,'wRC+','','') +
      makeStatCard(cs.hr,'HR','','') +
    '</div>';
  }

  return html;
}

function renderStats(isPitcher) {
  var d = _playerData;
  var html = '';

  html += '<div class="section-hdr">Career Year-by-Year</div>';
  html += '<div class="scroll-hint">← scroll →</div>';

  if (isPitcher) {
    html += '<div class="stats-table-wrap"><table class="stats-table"><thead><tr>' +

function makeStatCard(val, lbl, unit, tier) {
  var cls = tier ? 'sc-val ' + tier : 'sc-val';
  return '<div class="stat-card">' +
    '<div class="' + cls + '">' + (val != null ? val : '—') + '</div>' +
    '<div class="sc-lbl">' + lbl + '</div>' +
    (unit ? '<div class="sc-sub">' + unit + '</div>' : '') +
    '</div>';
}

function makeBio(label, val) {
  if (!val) return '';
  return '<div class="bio-card"><div class="bio-label">' + label + '</div><div class="bio-value">' + val + '</div></div>';
}

function renderPctBar(name, val, pct) {
  var cls = pct >= 90 ? 'pct-elite' : pct >= 70 ? 'pct-good' : pct >= 40 ? 'pct-avg' : pct >= 20 ? 'pct-poor' : 'pct-bad';
  var valColor = pct >= 90 ? '#4ade80' : pct >= 70 ? '#2dc653' : pct >= 40 ? '#60a5fa' : pct >= 20 ? '#f4a261' : '#e63946';
  return '<div class="pct-row">' +
    '<div class="pct-label-row">' +
      '<span class="pct-name">' + name + '</span>' +
      '<span class="pct-val" style="color:' + valColor + '">' + (val != null ? val : '—') + ' <span style="font-size:10px;opacity:0.6">(p' + pct + ')</span></span>' +
    '</div>' +
    '<div class="pct-track"><div class="pct-fill ' + cls + '" style="width:' + pct + '%"></div></div>' +
  '</div>';
}

function warDescription(war) {
  if (war >= 8) return 'MVP-level season';
  if (war >= 5) return 'All-Star caliber';
  if (war >= 3) return 'Above average starter';
  if (war >= 2) return 'Solid contributor';
  if (war >= 1) return 'Role player';
  if (war >= 0) return 'Replacement level';
  return 'Below replacement';
}

var _home = null, _homeErr = '', _boards = {}, _tool = null, _cmp = { a: null, b: null, hits: { a: [], b: [] } };
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function f3(v) { if (v == null || isNaN(v)) return '—'; var n = Number(v); return n < 1 ? '.' + ('000' + Math.round(n * 1000)).slice(-3) : n.toFixed(3); }
function sgn3(v) { var n = Math.round(Math.abs(v) * 1000); return (v < 0 ? '−' : '+') + '.' + ('000' + n).slice(-3); }
function photoOf(id) { return 'https://img.mlbstatic.com/mlb-photos/image/upload/d_people:generic:headshot:67:current.png/w_213,q_auto:best/v1/people/' + id + '/headshot/67/current'; }

function loadHome() {
  renderHome();
  if (_home || USE_MOCK) return;
  fetch(WORKER_URL + '/board/home').then(function(r) { return r.json(); }).then(function(j) {
    if (j && j.ok) { _home = j; _homeErr = ''; } else { _homeErr = 'The boards did not load.'; }
    renderHome();
  }).catch(function() { _homeErr = 'The boards did not load.'; renderHome(); });
}
function tapPlayer(id, name, isPitcher) {
  return ' onclick="openPlayerById(\'' + esc(id) + '\',\'' + encodeURIComponent(name).replace(/'/g, '%27') + '\',' + (isPitcher ? 1 : 0) + ')"';
}
function renderHome() {
  var el = document.getElementById('homeBoards');
  if (!el) return;
  var h = '';
  var head = function(icon, title, tool) { return '<div class="hb-head"><span>' + icon + ' ' + title + '</span><button onclick="openTool(\'' + tool + '\')">SEE ALL ›</button></div>'; };
  if (!_home) {
    h += '<div class="hb-wait">' + (_homeErr ? esc(_homeErr) : 'Loading the boards<span class="loading-dot">.</span><span class="loading-dot">.</span><span class="loading-dot">.</span>') + '</div>';
  } else {
    h += head('🍀', 'LUCK BOARD · DUE FOR BETTER', 'luck') + '<div class="hb-box">';
    (_home.due || []).forEach(function(p) { h += '<div class="hb-row"' + tapPlayer(p.id, p.n, 0) + '><span>' + esc(p.n) + '</span><b class="gl-good">xBA ' + f3(p.xba) + ' · AVG ' + f3(p.ba) + '</b></div>'; });
    h += '</div>' + head('🏆', 'HARDEST HITTERS', 'leaders') + '<div class="hb-box">';
    (_home.hard || []).forEach(function(p) { h += '<div class="hb-row"' + tapPlayer(p.id, p.n, 0) + '><span>' + esc(p.n) + '</span><b>' + p.ev.toFixed(1) + ' mph</b></div>'; });
    h += '</div>' + head('🎯', 'NASTIEST PITCHES', 'pitches') + '<div class="hb-box">';
    (_home.nasty || []).forEach(function(p) { h += '<div class="hb-row"' + tapPlayer(p.id, p.n, 1) + '><span>' + esc(p.n) + ' · ' + esc(String(p.pitch).toLowerCase()) + '</span><b>' + Math.round(p.whiff) + '% whiff</b></div>'; });
    h += '</div><div class="hb-yr">' + esc(_home.year) + ' SEASON · STATCAST</div>';
  }
  h += '<div class="hb-btns"><button onclick="openTool(\'compare\')">⚖️ COMPARE TWO PLAYERS</button></div>';
  el.innerHTML = h;
}
function openPlayerById(id, name, isPitcher) {
  try { name = decodeURIComponent(name); } catch (e) {}

}

var LEAD_STATS = {

};
function openTool(name) {
  _tool = { name: name, type: 'batter', stat: 'ev', metric: 'ba' };
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('playerView').style.display = 'none';
  document.getElementById('toolView').style.display = 'block';
  renderTool();
  window.scrollTo(0, 0);
}
function toolSet(k, v) {
  if (!_tool) return;
  _tool[k] = v;
  if (k === 'type') { _tool.stat = LEAD_STATS[v][0][0]; if (v === 'batter' && _tool.metric === 'era') _tool.metric = 'ba'; }
  renderTool();
}
function boardGet(kind, type) {
  var key = kind + ':' + type;
  if (_boards[key]) return _boards[key];
  _boards[key] = { wait: 1 };
  fetch(WORKER_URL + '/board/' + kind + (kind === 'pitches' ? '' : '?type=' + type)).then(function(r) { return r.json(); }).then(function(j) {
    _boards[key] = (j && j.ok) ? j : { err: 1 };
    if (_tool && _tool.name === kind) renderTool();
  }).catch(function() { _boards[key] = { err: 1 }; if (_tool && _tool.name === kind) renderTool(); });
  return _boards[key];
}
function segHtml(key, opts, cur) {
  return '<div class="tv-seg">' + opts.map(function(o) { return '<button class="' + (cur === o[0] ? 'on' : '') + '" onclick="toolSet(\'' + key + '\',\'' + o[0] + '\')">' + o[1] + '</button>'; }).join('') + '</div>';
}
function renderTool() {
  var el = document.getElementById('toolView'), t = _tool;
  if (!t) return;
  var h = '<div class="tv-bar"><button onclick="goHome()">‹ HOME</button><b>' + TOOL_TITLE[t.name] + '</b></div><div class="tv-body">';
  if (t.name === 'luck') h += renderLuckTool(t);
  else if (t.name === 'leaders') h += renderLeadTool(t);
  else if (t.name === 'pitches') h += renderPitchTool(t);
  else h += renderCompareTool();
  el.innerHTML = h + '</div>';
}
function waitHtml(B) { return B.err ? '<div class="no-data">Savant did not answer. Try again in a minute.</div>' : '<div class="tab-loading">Loading<span class="loading-dot">.</span><span class="loading-dot">.</span><span class="loading-dot">.</span></div>'; }

function renderLuckTool(t) {
  var pit = t.type === 'pitcher';
  var mets = [['ba', pit ? 'AVG AGAINST' : 'AVG'], ['slg', pit ? 'SLG AGAINST' : 'SLG'], ['woba', pit ? 'wOBA AGAINST' : 'wOBA']];
  if (pit) mets.push(['era', 'ERA']);
  var h = segHtml('type', [['batter', 'HITTERS'], ['pitcher', 'PITCHERS']], t.type) + segHtml('metric', mets, t.metric);
  var B = boardGet('luck', t.type);
  if (!B.players) return h + waitHtml(B);
  var m = t.metric, xk = 'x' + m, era = m === 'era';
  // "owed": how much better his results should be. A hitter is owed when expected beats actual;
  // a pitcher is owed when what he allowed is worse than what his contact deserved.
  var rows = B.players.filter(function(p) { return p[m] != null && p[xk] != null; }).map(function(p) {
    return { p: p, owed: pit ? p[m] - p[xk] : p[xk] - p[m] };
  });
  rows.sort(function(a, b) { return b.owed - a.owed; });
  var span = 0;
  rows.forEach(function(r) { if (Math.abs(r.owed) > span) span = Math.abs(r.owed); });
  var fmt = function(v) { return era ? v.toFixed(2) : f3(v); };
  var list = function(title, sub, arr, good) {
    var s = '<div class="section-hdr">' + title + '</div><div class="tv-sub">' + sub + '</div><div class="tv-list">';
    arr.forEach(function(r, i) {
      var w = span ? Math.max(4, Math.round(100 * Math.abs(r.owed) / span)) : 0;
      s += '<div class="tv-row"' + tapPlayer(r.p.id, r.p.n, pit) + '><i>' + (i + 1) + '</i><div class="nm">' + esc(r.p.n) + '<small>' + (r.p.pa ? Math.round(r.p.pa) + (pit ? ' BF' : ' PA') + ' · ' : '') + 'expected ' + fmt(r.p[xk]) + ' · actual ' + fmt(r.p[m]) + '</small>' +
        '<div class="tv-gap"><u class="' + (good ? 'g' : 'r') + '" style="width:' + w + '%"></u></div></div><b class="' + (good ? 'gl-good' : 'gl-bad') + '">' + (era ? (r.owed >= 0 ? '+' : '−') + Math.abs(r.owed).toFixed(2) : sgn3(r.owed)) + '</b></div>';
    });
    return s + '</div>';
  };
  h += list('🍀 Due for better', pit ? 'Allowed more than their contact deserved. Buy low.' : 'Hitting below their contact. Buy low.', rows.slice(0, 15), true);
  h += list('🎲 Riding luck', pit ? 'Allowed less than their contact deserved. Sell high.' : 'Hitting above their contact. Sell high.', rows.slice(-15).reverse(), false);
  return h + '<div class="tv-foot">' + esc(B.year) + ' season, at least 150 ' + (pit ? 'batters faced' : 'plate appearances') + '. The gap is expected minus actual. Tap a name for his page.</div>';
}
function renderLeadTool(t) {
  var defs = LEAD_STATS[t.type], cur = defs[0], i;
  for (i = 0; i < defs.length; i++) if (defs[i][0] === t.stat) cur = defs[i];
  var h = segHtml('type', [['batter', 'HITTERS'], ['pitcher', 'PITCHERS']], t.type) +
    '<div class="tv-chips">' + defs.map(function(d) { return '<button class="' + (d[0] === cur[0] ? 'on' : '') + '" onclick="toolSet(\'stat\',\'' + d[0] + '\')">' + d[1] + '</button>'; }).join('') + '</div>';
  var B = boardGet('leaders', t.type);
  if (!B.players) return h + waitHtml(B);
  var k = cur[0], hi = cur[2], rows = B.players.filter(function(p) { return p[k] != null; });
  rows.sort(function(a, b) { return hi ? b[k] - a[k] : a[k] - b[k]; });
  rows = rows.slice(0, 25);
  var lo = Infinity, mx = -Infinity;
  B.players.forEach(function(p) { if (p[k] != null) { if (p[k] < lo) lo = p[k]; if (p[k] > mx) mx = p[k]; } });
  h += '<div class="tv-list">';
  rows.forEach(function(p, n) {
    var f = mx > lo ? (p[k] - lo) / (mx - lo) : 1;
    if (!hi) f = 1 - f;
    h += '<div class="tv-row"' + tapPlayer(p.id, p.n, t.type === 'pitcher') + '><i>' + (n + 1) + '</i><div class="nm">' + esc(p.n) + '<div class="tv-gap"><u class="b" style="width:' + Math.max(4, Math.round(f * 100)) + '%"></u></div></div><b>' +
      (cur[4] === 3 ? f3(p[k]) : p[k].toFixed(1)) + '<em>' + cur[3] + '</em></b></div>';
  });
  return h + '</div><div class="tv-foot">' + esc(B.year) + ' season, at least 150 ' + (t.type === 'pitcher' ? 'batters faced' : 'plate appearances') + '.' + (hi ? '' : ' Lower is better here.') + '</div>';
}
function renderPitchTool(t) {
  var B = boardGet('pitches', 'x');
  if (!B.pitches) return waitHtml(B);
  var h = '<div class="tv-sub">The pitches batters miss most often, at least 200 thrown.</div><div class="tv-list">';
  B.pitches.slice(0, 40).forEach(function(p, n) {
    h += '<div class="tv-row"' + tapPlayer(p.id, p.n, 1) + '><i>' + (n + 1) + '</i><div class="nm">' + esc(p.n) + '<small>' + esc(p.pitch) + (p.tm ? ' · ' + esc(p.tm) : '') + ' · ' + (p.usage != null ? p.usage.toFixed(0) + '% of his pitches' : '') +
      (p.xwoba != null ? ' · xwOBA ' + f3(p.xwoba) : '') + '</small><div class="tv-gap"><u class="r2" style="width:' + Math.min(100, Math.round(p.whiff * 1.8)) + '%"></u></div></div><b>' + p.whiff.toFixed(1) + '<em>% whiff</em></b></div>';
  });
  return h + '</div><div class="tv-foot">' + esc(B.year) + ' season.</div>';
}

// ── compare ──
var CMP_ORDER = ['xwOBA', 'Barrel%', 'Sprint Speed', 'Chase Rate', 'Whiff%', 'Exit Velocity', 'K%', 'BB%', 'Hard Hit%', 'xERA', 'Fastball Velo', 'xBA', 'xSLG'];
var CMP_SHORT = { 'Barrel%': 'POWER', 'Sprint Speed': 'SPEED', 'Chase Rate': 'EYE', 'Whiff%': 'CONTACT', 'Exit Velocity': 'EXIT VELO', 'Fastball Velo': 'VELO', 'Hard Hit%': 'HARD HIT' };
function cmpSearch(slot, q) {
  clearTimeout(_cmp['t' + slot]);
  if (!q || q.length < 2) { _cmp.hits[slot] = []; cmpHits(slot); return; }
  _cmp['t' + slot] = setTimeout(function() {
    searchPlayers(q).then(function(res) { _cmp.hits[slot] = res.slice(0, 6); cmpHits(slot); }).catch(function() { _cmp.hits[slot] = []; cmpHits(slot); });
  }, 300);
}
function cmpHits(slot) {
  var el = document.getElementById('cmpHits_' + slot);
  if (!el) return;
  el.innerHTML = _cmp.hits[slot].map(function(p, i) { return '<div onclick="cmpPick(\'' + slot + '\',' + i + ')">' + esc(p.fullName) + ' <small>' + esc(p.team || '') + ' · ' + esc(p.position || '') + '</small></div>'; }).join('');
}
function cmpPick(slot, i) {
  var p = _cmp.hits[slot][i];
  if (!p) return;
  _cmp[slot] = { p: p, sc: null, wait: 1 };
  _cmp.hits[slot] = [];
  renderTool();
  fetch(WORKER_URL + '/statcast/' + p.id).then(function(r) { return r.json(); }).then(function(j) {
    if (_cmp[slot] && _cmp[slot].p === p) { _cmp[slot].sc = j || {}; _cmp[slot].wait = 0; if (_tool && _tool.name === 'compare') renderTool(); }
  }).catch(function() { if (_cmp[slot] && _cmp[slot].p === p) { _cmp[slot].sc = {}; _cmp[slot].wait = 0; if (_tool && _tool.name === 'compare') renderTool(); } });
}
function cmpClear(slot) { _cmp[slot] = null; renderTool(); }
function pctMap(sc) { var m = {}; ((sc && sc.percentiles) || []).forEach(function(x) { m[x.name] = x; }); return m; }
function radarSvg(axes, sets) {
  var n = axes.length, cx = 150, cy = 118, rad = 84, s = '<svg viewBox="0 0 300 240" class="rad-svg" xmlns="http://www.w3.org/2000/svg">', ring, i, k;
  var at = function(j, f) { var a = 2 * Math.PI * j / n; return [cx + rad * f * Math.sin(a), cy - rad * f * Math.cos(a)]; };
  for (ring = 1; ring <= 3; ring++) { var poly = []; for (i = 0; i < n; i++) { var q = at(i, ring / 3); poly.push(q[0].toFixed(1) + ',' + q[1].toFixed(1)); } s += '<polygon points="' + poly.join(' ') + '" fill="none" stroke="rgba(255,255,255,0.13)"/>'; }
  for (i = 0; i < n; i++) { var e = at(i, 1), l = at(i, 1.2); s += '<line x1="' + cx + '" y1="' + cy + '" x2="' + e[0].toFixed(1) + '" y2="' + e[1].toFixed(1) + '" stroke="rgba(255,255,255,0.1)"/><text x="' + l[0].toFixed(1) + '" y="' + (l[1] + 4).toFixed(1) + '" text-anchor="middle">' + esc(CMP_SHORT[axes[i]] || axes[i].toUpperCase()) + '</text>'; }
  for (k = 0; k < sets.length; k++) {
    var pts = [];
    for (i = 0; i < n; i++) { var v = sets[k].m[axes[i]], p = at(i, Math.max(0.06, (v ? v.pct : 0) / 100)); pts.push(p[0].toFixed(1) + ',' + p[1].toFixed(1)); }
    s += '<polygon points="' + pts.join(' ') + '" fill="' + sets[k].col + '" fill-opacity="0.26" stroke="' + sets[k].col + '" stroke-width="2.5" stroke-linejoin="round"/>';
  }
  return s + '</svg>';
}
function renderCompareTool() {
  var cols = { a: '#60a5fa', b: '#f4a261' }, h = '<div class="tv-sub">Pick two players. The shape is where each ranks in MLB, the edge is the best.</div><div class="cmp-slots">';
  ['a', 'b'].forEach(function(slot) {
    var c = _cmp[slot];
    h += '<div class="cmp-slot" style="border-color:' + cols[slot] + '">';
    if (c) h += '<div class="cmp-name" style="color:' + cols[slot] + '">' + esc(c.p.fullName) + '</div><small>' + esc(c.p.team || '') + (c.wait ? ' · loading…' : '') + '</small><button onclick="cmpClear(\'' + slot + '\')">CHANGE</button>';
    else h += '<input type="text" placeholder="Search a player…" autocomplete="off" oninput="cmpSearch(\'' + slot + '\',this.value)"><div class="cmp-hits" id="cmpHits_' + slot + '"></div>';
    h += '</div>';
  });
  h += '</div>';
  var A = _cmp.a && _cmp.a.sc ? pctMap(_cmp.a.sc) : null, B = _cmp.b && _cmp.b.sc ? pctMap(_cmp.b.sc) : null;
  if (!A && !B) return h;
  var axes = CMP_ORDER.filter(function(nm) { return (!A || A[nm]) && (!B || B[nm]); });
  if (axes.length < 3) return h + '<div class="no-data">' + (A && B ? 'These two do not share enough Statcast measures to compare, a hitter and a pitcher for instance.' : 'No Statcast numbers came back for this player.') + '</div>';
  var radAxes = axes.slice(0, 6), sets = [];
  if (A) sets.push({ m: A, col: cols.a });
  if (B) sets.push({ m: B, col: cols.b });
  h += '<div class="cmp-rad">' + radarSvg(radAxes, sets) + '</div><div class="tv-list">';
  axes.forEach(function(nm) {
    var a = A && A[nm], b = B && B[nm], aw = a && b && a.pct > b.pct, bw = a && b && b.pct > a.pct;
    h += '<div class="cmp-row"><b class="' + (aw ? 'w' : '') + '" style="color:' + cols.a + '">' + (a ? a.pct : '—') + '<small>' + (a ? esc(a.value) : '') + '</small></b><span>' + esc(nm) + '</span><b class="' + (bw ? 'w' : '') + '" style="color:' + cols.b + '">' + (b ? b.pct : '—') + '<small>' + (b ? esc(b.value) : '') + '</small></b></div>';
  });
  return h + '</div><div class="tv-foot">The big number is his percentile in MLB, 100 is the best. His actual figure is underneath.</div>';
}

// ═══════════════════════════════════════
// CARD 3 -- scouting grades and the luck chart, on a player's Overview
// ═══════════════════════════════════════
function gradeOf(pct) { return pct == null ? null : 20 + Math.round(pct * 0.6 / 5) * 5; }
function renderGrades(sc, isPitcher) {
  var m = pctMap(sc);
  var defs = isPitcher ? [['STUFF', 'Whiff%'], ['CONTROL', 'BB%'], ['VELO', 'Fastball Velo'], ['CONTACT', 'Hard Hit%']] : [['HIT', 'xBA'], ['POWER', 'Barrel%'], ['SPEED', 'Sprint Speed'], ['EYE', 'Chase Rate']];
  var any = false, h = '<div class="section-hdr">Tools · 20 to 80 scale</div><div class="gr-grid">';
  defs.forEach(function(d) {
    var x = m[d[1]], g = x ? gradeOf(x.pct) : null;
    if (g != null) any = true;
    h += '<div class="gr-cell"><b class="' + (g == null ? '' : g >= 60 ? 'hi' : g <= 40 ? 'lo' : '') + '">' + (g == null ? '—' : g) + '</b><i>' + d[0] + '</i></div>';
  });
  return any ? h + '</div><div class="gr-note">50 is the MLB average, 80 the very best. From his Statcast percentiles.</div>' : '';
}
function renderLuck(sc, isPitcher) {
  var L = sc.luck;
  if (!L) return '';
  var rows = [['AVG', L.ba, L.xba, 0.150, 0.350, 3], ['SLG', L.slg, L.xslg, 0.250, 0.650, 3], ['wOBA', L.woba, L.xwoba, 0.220, 0.450, 3]];
  if (isPitcher && L.era != null && L.xera != null) rows.push(['ERA', L.era, L.xera, 1.5, 6.5, 2]);
  var h = '<div class="section-hdr">Luck · expected against actual' + (isPitcher ? ' (what he allowed)' : '') + '</div><div class="lk-box">', any = false;
  rows.forEach(function(r) {
    if (r[1] == null || r[2] == null) return;
    any = true;
    var pos = function(v) { return Math.max(2, Math.min(98, 100 * (v - r[3]) / (r[4] - r[3]))); };
    var owed = isPitcher ? r[1] - r[2] : r[2] - r[1], eps = r[5] === 2 ? 0.25 : 0.012;
    var cls = owed > eps ? 'g' : owed < -eps ? 'a' : 'n', fm = function(v) { return r[5] === 2 ? v.toFixed(2) : f3(v); };
    h += '<div class="lk-row"><span>' + r[0] + '</span><div class="lk-track"><u class="' + cls + '" style="width:' + pos(r[2]) + '%"></u><em style="left:' + pos(r[1]) + '%"></em></div><b class="' + cls + '">' + fm(r[2]) + ' exp · ' + fm(r[1]) + '</b></div>';
  });
  if (!any) return '';
  var d = (L.woba != null && L.xwoba != null) ? (isPitcher ? L.woba - L.xwoba : L.xwoba - L.woba) : 0, msg, mc;
  if (d > 0.015) { msg = isPitcher ? 'He has allowed more than his contact deserved. Expect better results.' : 'He is hitting below his contact. Expect better results.'; mc = 'g'; }
  else if (d < -0.015) { msg = isPitcher ? 'He has allowed less than his contact deserved. Expect some fall back.' : 'He is ahead of his contact. Expect some fall back.'; mc = 'a'; }
  else { msg = 'His results match his contact. What you see is what he is.'; mc = 'n'; }
  return h + '<div class="lk-key">The bar is what his contact earned. The white dot is what he actually ' + (isPitcher ? 'allowed' : 'got') + '.</div></div><div class="lk-verdict ' + mc + '">' + msg + '</div>';
}

// The home screen is drawn as soon as the page opens.
loadHome();

// Opened from GameDay: ?embed=1 hides this page's own title bar, ?q=Name searches straight away.
(function() {
  var qs = location.search || '';
  if (/[?&]embed=1/.test(qs)) { document.body.className += ' embed'; }
  var m = /[?&]q=([^&]+)/.exec(qs);
  if (m) {
    var v = '';
    try { v = decodeURIComponent(m[1].replace(/\+/g, ' ')); } catch (e) { v = ''; }
    if (v) { document.getElementById('searchInput').value = v; doSearch(v); }
  }
})();
</script>
